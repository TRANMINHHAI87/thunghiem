<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietlott AI - V10 (Tổ hợp tín hiệu tự học)</title>
<!-- Thư viện OCR Tesseract.js v5 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0d1117; color: #c9d1d9;}
.wrapper{display:grid;grid-template-columns:280px 1fr 300px;gap:18px;padding:18px;}
.panel{min-width:0;background:#161b22;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,0.8); border: 1px solid #30363d;}

input,select{width:100%;padding:10px;border:1px solid #30363d;border-radius:8px;margin-top:10px;font-size: 14px; background: #010409; color: #fff;}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px;}
.grid6 input { text-align: center; font-weight: bold; color: #58a6ff; border: 2px solid #58a6ff; font-size: 16px; border-radius: 6px; margin-top: 0;}

.btns{display:flex;gap:10px;margin-top:12px;}
button{border:none;border-radius:8px;padding:12px 14px;cursor:pointer;font-weight:bold;flex: 1;transition: 0.2s; text-transform: uppercase;}
button:active { transform: scale(0.96); }

.save{background:#21262d;color:#c9d1d9; border: 1px solid #30363d;}
.predict{background:linear-gradient(45deg, #238636, #2ea043);color:white; box-shadow: 0 4px 15px rgba(46, 160, 67, 0.35);}
.backup{background:#1f6feb;color:white;}
.restore{background:#da3633;color:white;}

.delete-btn{padding:4px 10px;font-size:12px;margin-left:8px;background:#da3633;color: white;border-radius: 4px;cursor:pointer; flex: unset;}

/* MODULE QUÉT ẢNH OCR */
.ocr-zone {
    background: #0d1117;
    border: 2px dashed #58a6ff;
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
    text-align: center;
